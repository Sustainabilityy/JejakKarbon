<!doctype html>  
<html lang="id">  
<head>  
<meta charset="utf-8" />  
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />  
<title>JejakKarbonKu GGF</title>  
<!-- CSS & Styles tetap sama seperti sebelumnya -->
<style>
  :root { --esg-primary: #059669; --esg-dark: #022c22; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; margin: 0; }
  .app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
  .page { display: none; padding: 40px; } .page.active { display: block; }
  .card { background: white; border-radius: 24px; padding: 26px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
  .btn { padding: 14px 20px; border-radius: 12px; font-weight: 800; cursor: pointer; border: none; }
  .primary { background: var(--esg-primary); color: white; }
  .input-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
  input, select { padding: 12px; border-radius: 12px; border: 1.5px solid #cbd5e1; }
  @media(max-width: 900px) { .app { grid-template-columns: 1fr; } .page { padding: 20px; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" style="background: white; padding: 20px; border-right: 1px solid #e2e8f0;">
    <h2>JejakKarbonKu</h2>
    <nav class="nav">
      <button onclick="showPage('dashboard')">Dashboard</button>
      <button onclick="showPage('input')">Input</button>
      <button onclick="showPage('profile')">Profil</button>
    </nav>
  </aside>

  <main>
    <section id="dashboard" class="page active">
      <h1>Dashboard</h1>
      <div class="card">
        <h3>Total Emisi: <span id="grandTotal">0.00</span> kgCO₂e</h3>
      </div>
      <canvas id="trendChart"></canvas>
    </section>

    <section id="input" class="page">
      <h1>Input Emisi</h1>
      <div class="card">
        <input type="date" id="dateInput">
        <input type="number" id="motorGo" placeholder="Jarak Motor (km)">
        <button class="btn primary" id="saveRecordBtn">Simpan Lokal</button>
      </div>
    </section>

    <section id="profile" class="page">
      <h1>Profil Saya</h1>
      <div class="card">
        <div class="avatar-preview" style="width:100px; height:100px; border-radius:50%; background:#e2e8f0; margin-bottom:10px;">
          <img id="profAvatarImg" style="width:100%; height:100%; border-radius:50%; object-fit:cover; display:none;">
        </div>
        <input type="file" id="photoInput" accept="image/*">
        <div class="input-field"><label>Nama</label><input type="text" id="userName"></div>
        <div class="input-field"><label>NIK</label><input type="text" id="userId"></div>
        <div class="input-field"><label>Dept</label><input type="text" id="department"></div>
        <div class="input-field"><label>Team</label><input type="text" id="team"></div>
        <div class="input-field"><label>PG/Area</label><input type="text" id="pg"></div>
        <div class="input-field"><label>Role</label><input type="text" id="role"></div>
        <button class="btn primary" id="saveProfileBtn">Simpan Profil Lokal</button>
        <button class="btn" id="pullServerBtn" style="background:#0f172a; color:white;">🔄 Tarik Data dari Server</button>
      </div>
    </section>
  </main>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwtdrSeJN-mu1_rJ2IVfSadH-aS1flyZUdxQXYBCZ0trW4q_lRlyR9dfmnqOhPKHAlc/exec';
const BASE_KEY = 'ggf-carbon-v17';
let state = { profile: {}, records: [] };

const $ = id => document.getElementById(id);

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $(id).classList.add('active');
}

$('saveProfileBtn').onclick = () => {
  state.profile = {
    userId: $('userId').value, userName: $('userName').value,
    department: $('department').value, team: $('team').value,
    pg: $('pg').value, role: $('role').value, photo: state.profile.photo
  };
  localStorage.setItem(BASE_KEY, JSON.stringify(state));
  alert('Profil tersimpan lokal!');
};

$('pullServerBtn').onclick = async () => {
  const id = $('userId').value.trim();
  if(!id) return alert('Masukkan NIK!');
  try {
    const res = await fetch(SCRIPT_URL + "?userId=" + encodeURIComponent(id));
    const data = await res.json();
    if(data.status === 'success') {
      state.profile = { userId: id, userName: data.userName, department: data.department, team: data.team, pg: data.pg, role: data.role, photo: data.photo };
      state.records = data.records;
      localStorage.setItem(BASE_KEY, JSON.stringify(state));
      location.reload();
      alert('Data berhasil ditarik!');
    }
  } catch(e) { alert('Gagal tarik data'); }
};

$('saveServerBtnDesk').onclick = async () => {
  // Pastikan payload sesuai urutan kolom spreadsheet
  const payload = {
    tanggalEmisi: $('dateInput').value,
    userName: state.profile.userName,
    userId: state.profile.userId,
    department: state.profile.department,
    team: state.profile.team,
    pg: state.profile.pg,
    role: state.profile.role,
    motor: $('motorGo').value,
    totalEmission: 0, // hitung total di sini
    photo: state.profile.photo
  };
  await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
  alert('Tersimpan ke Server!');
};

window.onload = () => {
  const stored = localStorage.getItem(BASE_KEY);
  if(stored) {
    state = JSON.parse(stored);
    $('userName').value = state.profile.userName || '';
    $('userId').value = state.profile.userId || '';
    $('department').value = state.profile.department || '';
    $('team').value = state.profile.team || '';
    $('pg').value = state.profile.pg || '';
    $('role').value = state.profile.role || '';
    if(state.profile.photo) {
      $('profAvatarImg').src = state.profile.photo;
      $('profAvatarImg').style.display = 'block';
    }
  }
};
</script>
</body>
</html>
